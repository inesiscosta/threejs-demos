<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Two interactive Three.js demos: a drone watch and a Pepper's Ghost hologram display." />
    <!-- Link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Three.js Demos" />
    <meta property="og:title" content="Three.js Demos" />
    <meta property="og:description" content="Two interactive Three.js demos: a smartwatch drone that pops balloons and a Pepper's Ghost hologram display." />
    <meta property="og:url" content="https://threejs.inesiscosta.com/" />
    <meta property="og:image" content="https://threejs.inesiscosta.com/docs/social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Three.js Demos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>" />
    <style>
      :root {
        --bg: #111;
        --card: #1b1b1b;
        --border: rgba(255, 255, 255, 0.1);
        --text: #ddd;
        --muted: #888;
        --accent: #7cfc00;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: 48px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: "Courier New", monospace;
      }

      header { text-align: center; }

      h1 {
        font-size: 14px;
        font-weight: normal;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }

      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        width: 100%;
        max-width: 880px;
      }

      a.card {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        color: inherit;
        text-decoration: none;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: border-color 0.15s, transform 0.15s;
      }

      a.card:hover,
      a.card:focus-visible {
        border-color: var(--accent);
        transform: translateY(-2px);
        outline: none;
      }

      a.card img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #000;
      }

      .body { display: flex; flex-direction: column; gap: 8px; padding: 16px 18px 18px; }

      h2 { font-size: 18px; color: #fff; }

      a.card:hover h2,
      a.card:focus-visible h2 { color: var(--accent); }

      p { font-size: 13px; line-height: 1.5; color: var(--muted); }

      .tag {
        align-self: flex-start;
        margin-top: 4px;
        padding: 2px 8px;
        font-size: 11px;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
      }

      footer { font-size: 12px; color: var(--muted); }
      footer a { color: var(--muted); }
      footer a:hover { color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <h1>Three.js Demos</h1>
    </header>

    <main>
      <a class="card" href="drone-watch/">
        <img src="docs/drone-watch.png" alt="The drone watch with its arms deployed, flying between balloons" />
        <div class="body">
          <h2>Drone Watch</h2>
          <p>A smartwatch that unfolds four rotor arms, lifts off the wrist and flies around popping balloons.</p>
          <span class="tag">Keyboard</span>
        </div>
      </a>

      <a class="card" href="peppers-ghost/">
        <img src="docs/peppers-ghost.png" alt="A translucent tesseract with concentric-ring normal mapping" />
        <div class="body">
          <h2>Pepper's Ghost</h2>
          <p>A hologram display. Lay your screen under glass at 45° and the model floats in mid-air.</p>
          <span class="tag">Tap / click</span>
        </div>
      </a>
    </main>

    <footer>
      <a href="https://github.com/inesiscosta/threejs-demos">Source on GitHub</a>
    </footer>
  </body>
</html>
