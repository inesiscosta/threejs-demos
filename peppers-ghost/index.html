<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <meta name="description" content="A Three.js hologram display: lay your screen under glass at 45° and the model floats in mid-air." />
    <!-- Link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Three.js Demos" />
    <meta property="og:title" content="Pepper's Ghost" />
    <meta property="og:description" content="A Three.js hologram display: lay your screen under glass at 45° and the model floats in mid-air." />
    <meta property="og:url" content="https://threejs.inesiscosta.com/peppers-ghost/" />
    <meta property="og:image" content="https://threejs.inesiscosta.com/docs/peppers-ghost.png" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Pepper's Ghost</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <!-- Back to menu -->
      <div class="hud-panel">
        <div class="hud-label">MENU</div>
        <div class="hud-buttons">
          <a class="hud-btn" id="back" href="../" aria-label="Back to demos"><svg class="back-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a>
        </div>
      </div>

      <div class="hud-divider"></div>

      <!-- Models -->
      <div class="hud-panel">
        <div class="hud-label">MODELS</div>
        <div class="hud-buttons">
          <button class="hud-btn toggle" id="model-btn-0">Artemis</button>
          <button class="hud-btn toggle" id="model-btn-1">Cat</button>
          <button class="hud-btn toggle" id="model-btn-2">Tesseract</button>
        </div>
      </div>

      <div class="hud-divider"></div>

      <!-- Lights -->
      <div class="hud-panel">
        <div class="hud-label">LIGHTS</div>
        <div class="hud-buttons">
          <button class="hud-btn toggle" id="light-directional">DIR</button>
          <button class="hud-btn toggle" id="light-point">PNT</button>
          <button class="hud-btn toggle" id="light-spot">SPT</button>
          <button class="hud-btn toggle active" id="mat-lighting">LIT</button>
        </div>
      </div>

      <div class="hud-divider"></div>

      <!-- Materials -->
      <div class="hud-panel">
        <div class="hud-label">MATERIAL</div>
        <div class="hud-buttons">
          <button class="hud-btn toggle active" id="mat-btn-0">
            Lambert / Gouraud
          </button>
          <button class="hud-btn toggle" id="mat-btn-1">Phong</button>
        </div>
      </div>

      <div class="hud-divider"></div>

      <!-- Effects -->
      <div class="hud-panel">
        <div class="hud-label">FX</div>
        <div class="hud-buttons">
          <button class="hud-btn toggle" id="fx-anaglyph">
            Anaglyphic Effect
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
